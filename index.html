
<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=450" />
    <title>IR NETLIFY V10 • BACHELOR EDITION ⚡️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
        
        :root {
            --bg: #0a0a0a;
            --surface: #161616;
            --border: #333333;
            --text: #f5f5f5;
            --text-dim: #aaaaaa;
            --accent: #ffffff;
        }
        
        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px 12px;
        }
        
        .container {
            max-width: 520px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -1px;
        }
        
        .version {
            font-size: 0.65rem;
            background: #ffffff;
            color: #000;
            padding: 1px 8px;
            border-radius: 999px;
            font-weight: 800;
        }
        
        .tabs {
            display: flex;
            background: #111;
            border-radius: 9999px;
            padding: 4px;
            margin: 20px 0;
            border: 1px solid var(--border);
        }
        
        .tab-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 9999px;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            background: #ffffff;
            color: #000;
            font-weight: 700;
        }
        
        .section {
            margin-bottom: 18px;
        }
        
        .section-title {
            font-size: 0.78rem;
            color: var(--text-dim);
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .input {
            width: 100%;
            padding: 13px 16px;
            background: #111;
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-size: 0.95rem;
            margin-bottom: 10px;
        }
        
        .btn {
            padding: 12px 18px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }
        
        .btn-primary {
            background: #ffffff;
            color: #000;
        }
        
        .btn-secondary {
            background: transparent;
            border: 2px solid #666;
            color: var(--text-dim);
        }
        
        .category-btn {
            padding: 9px 10px;
            font-size: 0.72rem;
            background: #1f1f1f;
            border: 1px solid var(--border);
            color: var(--text-dim);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        
        .category-btn.all {
            background: #ffffff;
            color: #000;
            font-weight: 700;
            border: none;
        }
        
        .category-btn.active {
            background: #ffffff;
            color: #000;
            border-color: #ffffff;
        }
        
        .output {
            margin-top: 20px;
            display: none;
        }
        
        #result-area {
            width: 100%;
            min-height: 260px;
            background: #111;
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            color: #00ff9d;
            font-family: monospace;
            font-size: 0.88rem;
            line-height: 1.4;
            resize: vertical;
        }
        
        .stats-bar {
            background: #111;
            padding: 9px 14px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            margin: 12px 0;
            border: 1px solid var(--border);
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: #fff;
            padding: 12px 26px;
            border-radius: 9999px;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            display: none;
            z-index: 9999;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">IR NETLIFY <span class="version">V10</span></div>
            <div style="color:#888; font-size:0.8rem; margin-top:4px;">BACHELOR EDITION • BLACK &amp; WHITE</div>
        </div>
        
        <div class="tabs">
            <button onclick="switchTab(0)" class="tab-btn active" id="tab0">⚡ Netlify</button>
            <button onclick="switchTab(1)" class="tab-btn" id="tab1">✎ Tools</button>
        </div>
        
        <!-- NETLIFY TAB -->
        <div id="panel-netlify">
            <div class="section">
                <div class="section-title">MODE</div>
                <div style="display:flex; gap:8px; margin-bottom:14px;">
                    <button onclick="setNetlifyMode('shecan')" id="mode-shecan" class="btn btn-primary" style="flex:1; padding:11px 0; font-size:0.88rem;">IP + SNI (Shecan)</button>
                    <button onclick="setNetlifyMode('normal')" id="mode-normal" class="btn btn-secondary" style="flex:1; padding:11px 0; font-size:0.88rem;">Direct SNI</button>
                </div>
            </div>
            
            <div class="section">
                <div class="section-title">SERVER TYPE</div>
                <div style="display:flex; gap:8px; margin-bottom:14px;">
                    <button onclick="setConfigMode('default')" id="type-default" class="btn btn-secondary" style="flex:1; padding:10px 0; font-size:0.82rem;">Parsa / Xarheon Server</button>
                    <button onclick="setConfigMode('custom')" id="type-custom" class="btn btn-secondary" style="flex:1; padding:10px 0; font-size:0.82rem;">Custom Server</button>
                </div>
            </div>
            
            <div id="custom-settings" style="display:none; background:#1a1a1a; border:1px dashed #555; padding:14px; border-radius:14px; margin-bottom:16px;">
                <div class="section-title" style="color:#ccc;">CUSTOM PARAMETERS</div>
                <input id="custom-user" class="input" placeholder="Custom UUID">
                <input id="custom-path" class="input" placeholder="Custom Path (e.g. /p4r34m)">
            </div>
            
            <div class="section">
                <div class="section-title">NETLIFY DOMAIN</div>
                <input id="main-host" class="input" placeholder="your-project.netlify.app" value="example.netlify.app">
            </div>
            
            <div class="section">
                <div class="section-title">SNI DOMAINS</div>
                
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(82px, 1fr)); gap:6px; margin-bottom:10px;">
                    <button onclick="loadSniCategory('all', this)" class="category-btn all">🌐 ALL</button>
                    <button onclick="loadSniCategory('best', this)" class="category-btn">⭐ BEST</button>
                    <button onclick="loadSniCategory('helm', this)" class="category-btn">⎈ Helm</button>
                    <button onclick="loadSniCategory('k8s', this)" class="category-btn">☸️ K8s</button>
                    <button onclick="loadSniCategory('sigs', this)" class="category-btn">🔧 SIGs</button>
                    <button onclick="loadSniCategory('mesh', this)" class="category-btn">🕸️ Mesh</button>
                    <button onclick="loadSniCategory('storage', this)" class="category-btn">💾 Storage</button>
                    <button onclick="loadSniCategory('gitops', this)" class="category-btn">🔄 GitOps</button>
                    <button onclick="loadSniCategory('security', this)" class="category-btn">🔒 Security</button>
                </div>
                
                <textarea id="domain-list" class="input" rows="5" placeholder="One domain per line..."></textarea>
                
                <div style="display:flex; gap:8px; margin-top:6px;">
                    <button onclick="document.getElementById('domain-list').value=''" class="btn btn-secondary" style="flex:1; padding:8px; font-size:0.78rem;">Clear</button>
                    <button onclick="pasteToArea('domain-list')" class="btn btn-secondary" style="flex:1; padding:8px; font-size:0.78rem;">Paste</button>
                </div>
            </div>
            
            <div class="section" id="ip-section">
                <div class="section-title">IP ADDRESSES (Shecan Mode)</div>
                <textarea id="ip-list" class="input" rows="4" placeholder="One IP per line..."></textarea>
                <div style="display:flex; gap:8px; margin-top:6px;">
                    <button onclick="loadDefaultIps()" class="btn btn-secondary" style="flex:1; padding:8px; font-size:0.78rem;">Load Shecan IPs</button>
                    <button onclick="document.getElementById('ip-list').value=''" class="btn btn-secondary" style="flex:0.7; padding:8px; font-size:0.78rem;">Clear</button>
                </div>
            </div>
            
            <div class="stats-bar">
                <div>Generated: <strong id="config-count">0</strong></div>
                <div id="mode-text">Mode: IP + SNI</div>
            </div>
            
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button onclick="generateConfigs()" class="btn btn-primary" style="flex:2; padding:16px; font-size:1rem;">⚡️ GENERATE CONFIGS</button>
                <button onclick="generateBalancedJSON()" class="btn btn-secondary" style="flex:1; padding:16px; font-size:0.85rem;">JSON</button>
            </div>
            
            <!-- Advanced Tools -->
            <div class="section" style="margin-top:16px; border:1px dashed #444; padding:14px; border-radius:14px; background:#111;">
                <div class="section-title" style="margin-bottom:10px; color:#888;">🔧 ADVANCED TOOLS (از نسخه‌های قبلی)</div>
                
                <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;">
                    <button onclick="renameConfigs('ww')" class="btn btn-secondary" style="padding:8px 12px; font-size:0.75rem;">ww</button>
                    <button onclick="renameConfigs('iran')" class="btn btn-secondary" style="padding:8px 12px; font-size:0.75rem;">🇮🇷 ایران</button>
                    <button onclick="renameConfigs('fast')" class="btn btn-secondary" style="padding:8px 12px; font-size:0.75rem;">🚀 Fast</button>
                    <button onclick="renameConfigs('clean')" class="btn btn-secondary" style="padding:8px 12px; font-size:0.75rem;">Clean</button>
                    <button onclick="dedupAndSort()" class="btn btn-secondary" style="padding:8px 12px; font-size:0.75rem;">Dedup + Sort</button>
                    <button onclick="shuffleConfigs()" class="btn btn-secondary" style="padding:8px 12px; font-size:0.75rem;">🔀 Shuffle</button>
                    <button onclick="extractNames()" class="btn btn-secondary" style="padding:8px 12px; font-size:0.75rem;">Extract Names</button>
                </div>
            </div>
            
            <div id="output-container" class="output">
                <textarea id="result-area" readonly></textarea>
                <div style="display:flex; gap:8px; margin-top:10px;">
                    <button onclick="copyConfigs()" class="btn btn-primary" style="flex:1; padding:12px; font-size:0.9rem;">📋 COPY</button>
                    <button onclick="downloadConfigs()" class="btn btn-secondary" style="flex:1; padding:12px; font-size:0.9rem;">⬇️ TXT</button>
                    <button onclick="shareConfigs()" class="btn btn-secondary" style="flex:1; padding:12px; font-size:0.9rem;">🔗 SHARE</button>
                </div>
            </div>
        </div>
        
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script>
        let netlifyMode = 'shecan';
        let configMode = 'default';
        
        const sniCategories = {
            all: ["helm.sh","blog.helm.sh","docs.helm.sh","kubernetes.io","kubectl.docs.kubernetes.io","kubebuilder.io","operatorframework.io","kind.sigs.k8s.io","kops.sigs.k8s.io","krew.sigs.k8s.io","kwok.sigs.k8s.io","kueue.sigs.k8s.io","jobset.sigs.k8s.io","kaniko.sigs.k8s.io","minikube.sigs.k8s.io","kustomize.sigs.k8s.io","cluster-api.sigs.k8s.io","descheduler.sigs.k8s.io","gateway-api.sigs.k8s.io","external-dns.sigs.k8s.io","service-apis.sigs.k8s.io","image-builder.sigs.k8s.io","metrics-server.sigs.k8s.io","scheduler-plugins.sigs.k8s.io","controller-runtime.sigs.k8s.io","prometheus-operator.sigs.k8s.io","node-feature-discovery.sigs.k8s.io","hierarchical-namespaces.sigs.k8s.io","secrets-store-csi-driver.sigs.k8s.io","security-profiles-operator.sigs.k8s.io","cluster-proportional-autoscaler.sigs.k8s.io","container.sigs.k8s.io","istio.io","cilium.io","linkerd.io","calico.org","rook.io","openebs.io","longhorn.io","fluxcd.io","argo-cd.readthedocs.io","tekton.dev","cert-manager.io","letsencrypt.org","keda.sh","crossplane.io","harbor.io"],
            
            best: ["kubernetes.io","letsencrypt.org","kwok.sigs.k8s.io","kind.sigs.k8s.io","kueue.sigs.k8s.io","jobset.sigs.k8s.io","minikube.sigs.k8s.io","kustomize.sigs.k8s.io","cluster-api.sigs.k8s.io","gateway-api.sigs.k8s.io","image-builder.sigs.k8s.io","secrets-store-csi-driver.sigs.k8s.io","helm.sh","fluxcd.io"],
            
            helm: ["helm.sh","blog.helm.sh","docs.helm.sh"],
            k8s: ["kubernetes.io","kubectl.docs.kubernetes.io","kubebuilder.io","operatorframework.io"],
            sigs: ["kind.sigs.k8s.io","kops.sigs.k8s.io","krew.sigs.k8s.io","kwok.sigs.k8s.io","kueue.sigs.k8s.io","jobset.sigs.k8s.io","kaniko.sigs.k8s.io","minikube.sigs.k8s.io","kustomize.sigs.k8s.io","cluster-api.sigs.k8s.io","descheduler.sigs.k8s.io","gateway-api.sigs.k8s.io","external-dns.sigs.k8s.io","service-apis.sigs.k8s.io","image-builder.sigs.k8s.io","metrics-server.sigs.k8s.io","scheduler-plugins.sigs.k8s.io","controller-runtime.sigs.k8s.io","prometheus-operator.sigs.k8s.io","node-feature-discovery.sigs.k8s.io","hierarchical-namespaces.sigs.k8s.io","secrets-store-csi-driver.sigs.k8s.io","security-profiles-operator.sigs.k8s.io","cluster-proportional-autoscaler.sigs.k8s.io","container.sigs.k8s.io"],
            mesh: ["istio.io","cilium.io","linkerd.io","calico.org","gateway-api.sigs.k8s.io"],
            storage: ["rook.io","openebs.io","longhorn.io"],
            gitops: ["fluxcd.io","argo-cd.readthedocs.io","tekton.dev"],
            security: ["cert-manager.io","letsencrypt.org","secrets-store-csi-driver.sigs.k8s.io","security-profiles-operator.sigs.k8s.io"]
        };
        
        const defaultIps = [
          "50.7.5.83","50.7.87.2","50.7.87.3","50.7.87.4","50.7.87.5",
          "75.2.60.5","144.76.1.88","104.21.33.34","188.114.98.0","188.114.99.0",
          "3.162.247.34","3.162.247.38","3.162.247.45","3.162.247.77","3.33.186.135",
          "63.176.8.218","85.10.207.48","94.130.33.41","95.216.69.37","104.198.14.52",
          "104.21.63.202","15.197.167.90","172.67.150.14","204.12.196.34","35.157.26.135",
          "52.222.214.38","52.222.214.99","54.232.119.62","65.109.34.234","94.130.70.160",
          "138.201.54.122","142.54.178.211","172.67.158.128","184.171.110.10",
          "52.222.214.108","52.222.214.124","63.141.252.203"
        ];
        
        function switchTab(tab) {
            // Simple single tab for now
        }
        
        function setNetlifyMode(mode) {
            netlifyMode = mode;
            document.getElementById('mode-shecan').classList.toggle('btn-primary', mode === 'shecan');
            document.getElementById('mode-shecan').classList.toggle('btn-secondary', mode !== 'shecan');
            document.getElementById('mode-normal').classList.toggle('btn-primary', mode === 'normal');
            document.getElementById('mode-normal').classList.toggle('btn-secondary', mode !== 'normal');
            document.getElementById('ip-section').style.display = mode === 'shecan' ? 'block' : 'none';
            updateLiveStats();
        }
        
        function setConfigMode(mode) {
            configMode = mode;
            document.getElementById('custom-settings').style.display = mode === 'custom' ? 'block' : 'none';
            document.getElementById('type-default').classList.toggle('btn-primary', mode === 'default');
            document.getElementById('type-default').classList.toggle('btn-secondary', mode !== 'default');
            document.getElementById('type-custom').classList.toggle('btn-primary', mode === 'custom');
            document.getElementById('type-custom').classList.toggle('btn-secondary', mode !== 'custom');
        }
        
        function loadSniCategory(category, btn) {
            const textarea = document.getElementById('domain-list');
            textarea.value = sniCategories[category].join('\n');
            updateLiveStats();
            
            // Remove active from all
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }
        
        function loadDefaultIps() {
            document.getElementById('ip-list').value = defaultIps.join('\n');
            updateLiveStats();
        }
        
        function pasteToArea(id) {
            navigator.clipboard.readText().then(text => {
                const el = document.getElementById(id);
                el.value = (el.value.trim() ? el.value + '\n' : '') + text.trim();
                updateLiveStats();
            }).catch(() => showToast("Clipboard denied", true));
        }
        
        function updateLiveStats() {
            const domains = document.getElementById('domain-list').value.trim().split('\n').filter(Boolean);
            let count = domains.length;
            if (netlifyMode === 'shecan') {
                const ips = document.getElementById('ip-list').value.trim().split('\n').filter(Boolean);
                count *= Math.max(ips.length, 1);
            }
            document.getElementById('config-count').textContent = count || 0;
            document.getElementById('mode-text').textContent = `Mode: ${netlifyMode === 'shecan' ? 'IP + SNI' : 'Direct SNI'}`;
        }
        
        function generateConfigs() {
            const host = document.getElementById('main-host').value.trim() || "example.netlify.app";
            const domains = document.getElementById('domain-list').value.trim().split('\n').filter(Boolean);
            
            if (!domains.length) { showToast("Please enter at least one SNI domain", true); return; }
            
            let uuid = "Telegram-Parsashonam";
            let path = "/p4r34m";
            
            if (configMode === 'custom') {
                uuid = document.getElementById('custom-user').value.trim() || uuid;
                path = document.getElementById('custom-path').value.trim() || path;
            }
            
            let configs = [];
            if (netlifyMode === 'shecan') {
                const ips = document.getElementById('ip-list').value.trim().split('\n').filter(Boolean);
                if (!ips.length) { showToast("Please enter at least one IP for Shecan mode", true); return; }
                domains.forEach(sni => ips.forEach(ip => {
                    configs.push(`vless://${uuid}@${ip}:443?encryption=none&security=tls&sni=${sni}&alpn=h2,http/1.1&insecure=1&type=xhttp&host=${host}&path=${path}#IR_NETLIFY_${sni}`);
                }));
            } else {
                domains.forEach(sni => {
                    configs.push(`vless://${uuid}@${sni}:443?encryption=none&security=tls&sni=${sni}&alpn=h2,http/1.1&type=xhttp&host=${host}&path=${path}#IR_NETLIFY_${sni}`);
                });
            }
            
            document.getElementById('result-area').value = configs.join('\n\n');
            document.getElementById('output-container').style.display = 'block';
            showToast(`✅ Generated ${configs.length} configs!`);
        }
        
        function generateBalancedJSON() {
            const text = document.getElementById('result-area').value;
            if (!text) { showToast("ابتدا کانفیگ تولید کنید!", true); return; }
            
            const lines = text.trim().split('\n\n');
            const json = {
                version: "V10 Bachelor Edition",
                total: lines.length,
                configs: lines.map((line, i) => {
                    const match = line.match(/#(.+)$/);
                    return {
                        id: i + 1,
                        remark: match ? match[1] : `Config ${i+1}`,
                        vless: line.split('#')[0]
                    };
                })
            };
            
            const jsonStr = JSON.stringify(json, null, 2);
            document.getElementById('result-area').value = jsonStr;
            showToast("✅ Balanced JSON آماده شد!");
        }
        
        function renameConfigs(preset) {
            let text = document.getElementById('result-area').value;
            if (!text) { showToast("ابتدا کانفیگ تولید کنید!", true); return; }
            
            let prefix = "";
            switch(preset) {
                case 'ww': prefix = "ww | "; break;
                case 'iran': prefix = "🇮🇷 IR | "; break;
                case 'fast': prefix = "🚀 FAST | "; break;
                case 'clean': prefix = ""; break;
            }
            
            const newText = text.split('\n\n').map(line => {
                return line.replace(/#(.+)$/, `#${prefix}$1`);
            }).join('\n\n');
            
            document.getElementById('result-area').value = newText;
            showToast(`✅ ریمارک‌ها به ${preset.toUpperCase()} تغییر کرد`);
        }
        
        function dedupAndSort() {
            let text = document.getElementById('result-area').value;
            if (!text) return;
            
            const lines = [...new Set(text.trim().split('\n\n'))]; // dedup
            lines.sort(); // sort
            document.getElementById('result-area').value = lines.join('\n\n');
            showToast(`✅ تکراری‌ها حذف و مرتب شد (${lines.length} کانفیگ)`);
        }
        
        function shuffleConfigs() {
            let text = document.getElementById('result-area').value;
            if (!text) return;
            
            let lines = text.trim().split('\n\n');
            for (let i = lines.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [lines[i], lines[j]] = [lines[j], lines[i]];
            }
            document.getElementById('result-area').value = lines.join('\n\n');
            showToast("✅ کانفیگ‌ها شافل شدند!");
        }
        
        function extractNames() {
            let text = document.getElementById('result-area').value;
            if (!text) return;
            
            const names = text.match(/#(.+)/g) || [];
            const cleanNames = names.map(n => n.replace('#', '').trim());
            document.getElementById('result-area').value = cleanNames.join('\n');
            showToast(`✅ ${cleanNames.length} نام استخراج شد`);
        }
        
        function copyConfigs() {
            navigator.clipboard.writeText(document.getElementById('result-area').value).then(() => showToast("📋 Copied!"));
        }
        
        function downloadConfigs() {
            const text = document.getElementById('result-area').value;
            const blob = new Blob([text], {type: "text/plain"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = `IR_NETLIFY_V10_${Date.now()}.txt`; a.click();
            URL.revokeObjectURL(url);
        }
        
        function shareConfigs() {
            const text = document.getElementById('result-area').value;
            if (!text) { showToast("ابتدا کانفیگ تولید کنید!", true); return; }
            
            const shareText = `🔗 IR NETLIFY V10 BACHELOR EDITION\n\n${text}\n\n📌 Shared from: https://github.com/johncarterjourney-rgb/netlify-config-generator`;
            
            navigator.clipboard.writeText(shareText).then(() => {
                showToast("🔗 لینک شیر آماده شد! (کپی شد)");
            }).catch(() => {
                // Fallback
                const encoded = btoa(unescape(encodeURIComponent(text)));
                const shareUrl = `${location.origin}${location.pathname}#configs=${encoded}`;
                prompt("لینک شیر (کپی کنید):", shareUrl);
            });
        }
        
        function showToast(msg, error = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.color = error ? '#ff6b00' : '#ffffff';
            toast.style.display = 'flex';
            setTimeout(() => toast.style.display = 'none', 2600);
        }
        
        function init() {
            setNetlifyMode('shecan');
            setConfigMode('default');
            loadSniCategory('all', document.querySelector('.category-btn.all'));
            loadDefaultIps();
            
            ['domain-list', 'ip-list'].forEach(id => {
                document.getElementById(id).addEventListener('input', updateLiveStats);
            });
            
            updateLiveStats();
        }
        
        window.onload = init;
    </script>
</body>
</html>
