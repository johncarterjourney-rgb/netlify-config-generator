<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IR NETLIFY V10 • ULTIMATE BACHELOR EDITION ⚡️ The most advanced, beautiful & powerful free VLESS config generator for Iran">
    <title>IR NETLIFY V10 • ULTIMATE BACHELOR ⚡️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

        :root {
            --neon-cyan: #00f0ff;
            --neon-purple: #c300ff;
            --neon-green: #00ff9d;
            --neon-orange: #ff6b00;
            --neon-pink: #ff00cc;
            --glass: rgba(15, 18, 30, 0.96);
            --glass-border: rgba(0, 240, 255, 0.45);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a0033 100%);
            color: #e0e0ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Background effects */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, var(--neon-cyan) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, var(--neon-purple) 0%, transparent 50%);
            opacity: 0.12;
            filter: blur(140px);
            animation: pulse 25s infinite alternate ease-in-out;
            z-index: -1;
        }

        .scanlines {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(0, 240, 255, 0.03) 2px,
                rgba(0, 240, 255, 0.03) 4px
            );
            pointer-events: none;
            z-index: 1;
            animation: scan 4s linear infinite;
        }

        .container {
            background: var(--glass);
            backdrop-filter: blur(32px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 42px 38px;
            width: 100%;
            max-width: 520px;
            box-shadow: 
                0 0 100px rgba(0, 240, 255, 0.25),
                inset 0 0 60px rgba(255, 0, 204, 0.1);
            position: relative;
            z-index: 2;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.65rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00f0ff, #ff00cc, #00ff9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            cursor: pointer;
            letter-spacing: -2px;
            transition: all 0.3s ease;
            text-shadow: 0 0 30px var(--neon-cyan);
        }
        .logo:hover { transform: scale(1.05) rotate(2deg); }

        h2 {
            text-align: center;
            margin: 8px 0 32px;
            color: #ccc;
            letter-spacing: 4px;
            font-size: 1.1rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(90deg, var(--neon-orange), #ff00cc);
            color: #000;
            font-size: 0.7rem;
            padding: 2px 10px;
            border-radius: 9999px;
            font-weight: 700;
            margin-left: 8px;
            vertical-align: middle;
        }

        .tabs, .sub-tabs {
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.45);
            padding: 6px;
            border-radius: 20px;
            margin-bottom: 24px;
        }

        .tab-btn, .sub-tab-btn {
            flex: 1;
            padding: 15px 18px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: #ddd;
        }

        .tab-btn.active, .sub-tab-btn.active {
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            color: #000;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.7);
            transform: translateY(-1px);
        }

        .input-group {
            margin-bottom: 24px;
            position: relative;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--neon-cyan);
            margin-bottom: 9px;
            letter-spacing: 0.5px;
        }

        .input-group small {
            color: var(--neon-green);
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 17px 18px;
            background: rgba(10, 12, 28, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.35);
            border-radius: 18px;
            color: #fff;
            font-size: 1.02rem;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 0 5px rgba(0, 240, 255, 0.25);
            outline: none;
        }

        .action-bar {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-small {
            padding: 9px 16px;
            font-size: 0.8rem;
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: #ddd;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-small:hover {
            background: rgba(0, 240, 255, 0.15);
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
        }

        .gen-btn {
            width: 100%;
            padding: 20px;
            margin: 20px 0 12px;
            background: linear-gradient(90deg, #00f0ff, #ff00cc, #00ff9d);
            background-size: 300% 300%;
            color: #000;
            font-weight: 800;
            font-size: 1.25rem;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.8);
            animation: gradientShift 8s ease infinite;
            transition: all 0.3s ease;
        }

        .gen-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 55px rgba(0, 240, 255, 1);
        }

        #output-container {
            margin-top: 30px;
            animation: fadeIn 0.6s ease forwards;
        }

        #result-area {
            width: 100%;
            min-height: 320px;
            font-family: 'Space Grotesk', monospace;
            padding: 20px;
            background: #0d1117;
            border: 2px solid #222;
            border-radius: 20px;
            color: #0ff;
            line-height: 1.5;
            resize: vertical;
            box-shadow: inset 0 0 25px rgba(0, 240, 255, 0.2);
        }

        .output-actions {
            display: flex;
            gap: 12px;
            margin-top: 14px;
        }

        .copy-btn, .download-btn, .share-btn {
            flex: 1;
            padding: 16px;
            border-radius: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.05rem;
        }

        .copy-btn {
            background: linear-gradient(90deg, var(--neon-green), #00cc77);
            color: #000;
        }

        .download-btn {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .share-btn {
            background: transparent;
            border: 2px solid var(--neon-purple);
            color: var(--neon-purple);
        }

        .stats {
            background: rgba(0, 240, 255, 0.1);
            border-radius: 16px;
            padding: 12px 18px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--neon-cyan);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            color: var(--neon-cyan);
            padding: 18px 32px;
            border-radius: 9999px;
            box-shadow: 0 0 40px rgba(0,240,255,0.7);
            display: none;
            z-index: 10000;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }

        @keyframes pulse { 0% { opacity: 0.08; } 100% { opacity: 0.18; } }
        @keyframes scan { 0% { background-position: 0 0; } 100% { background-position: 0 100%; } }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* Advanced section */
        .advanced {
            background: rgba(255,107,0,0.09);
            border: 1px dashed #ff6b00;
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
        }

        .custom-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    
    <div class="container">
        <!-- Header -->
        <div class="logo" onclick="confettiBurst()">IR NETLIFY <span class="badge">V10</span></div>
        <h2>ULTIMATE BACHELOR EDITION ⚡️</h2>

        <!-- Mode tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="setMainTab(0)">Netlify VLESS</button>
        </div>

        <div class="sub-tabs" id="netlify-options">
            <button class="sub-tab-btn active" id="btn-shecan" onclick="setNetlifyMode('shecan')">IP + SNI (Shecan)</button>
            <button class="sub-tab-btn" id="btn-normal" onclick="setNetlifyMode('normal')">Direct SNI</button>
        </div>

        <div class="sub-tabs" id="netlify-config-type">
            <button class="sub-tab-btn active" id="btn-default" onclick="setConfigMode('default')">Parsa Server</button>
            <button class="sub-tab-btn" id="btn-custom" onclick="setConfigMode('custom')">Your Server</button>
        </div>

        <!-- Custom settings -->
        <div id="custom-settings" class="advanced" style="display:none;">
            <div class="input-group">
                <label>Custom UUID <span onclick="generateRandomUUID()" style="cursor:pointer;color:var(--neon-green);font-size:0.8rem;">[RANDOM]</span></label>
                <input id="custom-user" placeholder="your-uuid-here" type="text">
            </div>
            <div class="input-group">
                <label>Custom Path</label>
                <input id="custom-path" placeholder="/p4r34m" type="text">
            </div>
            
            <!-- Extra advanced options -->
            <div class="custom-toggle" onclick="toggleAdvanced()">
                <input type="checkbox" id="advanced-check" checked>
                <label for="advanced-check" style="margin:0;color:#ddd;">Show advanced parameters</label>
            </div>
            <div id="extra-params" style="margin-top:14px;display:flex;gap:12px;flex-wrap:wrap;">
                <select id="fingerprint" style="padding:12px 16px;border-radius:14px;background:rgba(10,12,28,0.9);border:1px solid rgba(0,240,255,0.3);color:#fff;flex:1;min-width:120px;">
                    <option value="chrome">Fingerprint: Chrome</option>
                    <option value="firefox">Fingerprint: Firefox</option>
                    <option value="safari">Fingerprint: Safari</option>
                    <option value="random">Random</option>
                </select>
                <select id="alpn-select" style="padding:12px 16px;border-radius:14px;background:rgba(10,12,28,0.9);border:1px solid rgba(0,240,255,0.3);color:#fff;flex:1;min-width:120px;">
                    <option value="h2,http/1.1">ALPN: h2,http/1.1</option>
                    <option value="h2">ALPN: h2 only</option>
                </select>
            </div>
        </div>

        <!-- Main inputs -->
        <div class="input-group">
            <label>Netlify Domain <small>your-project.netlify.app</small></label>
            <input id="main-host" placeholder="example.netlify.app" type="text">
        </div>

        <div class="input-group">
            <label>SNI Domains</label>
            <textarea id="domain-list" rows="5" placeholder="Enter one domain per line..."></textarea>
            <div class="action-bar">
                <button class="btn-small" onclick="loadDefaultDomains('cncf')">CNCF / K8s</button>
                <button class="btn-small" onclick="loadDefaultDomains('popular')">Popular Bypass</button>
                <button class="btn-small" onclick="loadDefaultDomains('cloudflare')">Cloudflare</button>
                <button class="btn-small" onclick="document.getElementById('domain-list').value=''">Clear</button>
                <button class="btn-small" onclick="pasteToArea('domain-list')">Paste</button>
            </div>
        </div>

        <div class="input-group" id="ip-group">
            <label>IP Addresses</label>
            <textarea id="ip-list" rows="4" placeholder="Enter one IP per line..."></textarea>
            <div class="action-bar">
                <button class="btn-small" onclick="loadDefaultIps()">Shecan Default</button>
                <button class="btn-small" onclick="document.getElementById('ip-list').value=''">Clear</button>
                <button class="btn-small" onclick="pasteToArea('ip-list')">Paste</button>
            </div>
        </div>

        <!-- Live stats -->
        <div id="live-stats" class="stats">
            <div>Configs will generate: <strong id="config-count">0</strong></div>
            <div id="mode-indicator">Mode: IP + SNI</div>
        </div>

        <button class="gen-btn" onclick="generateConfigs()">
            ⚡️ GENERATE VLESS CONFIGS ⚡️
        </button>

        <!-- Output -->
        <div id="output-container" style="display:none;">
            <textarea id="result-area" readonly></textarea>
            <div class="output-actions">
                <button class="copy-btn" onclick="copyConfigs()">📋 COPY ALL</button>
                <button class="download-btn" onclick="downloadConfigs()">⬇️ DOWNLOAD .TXT</button>
                <button class="share-btn" onclick="shareConfigs()">🔗 SHARE LINK</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ==================== STATE ====================
        let netlifyMode = 'shecan';
        let configMode = 'default';
        let showAdvanced = true;

        // Default data
        const defaultLists = {
            cncf: ["helm.sh","keda.sh","rook.io","istio.io","cilium.io","fluxcd.io","harbor.io","calico.org","linkerd.io","openebs.io","tekton.dev","longhorn.io","kubernetes.io","cert-manager.io","letsencrypt.org"],
            popular: ["discord.com","github.com","cloudflare.com","akamai.com","fastly.net","googleapis.com","gstatic.com","youtube.com","netflix.com","openai.com"],
            cloudflare: ["one.one.one.one","cloudflare.com","cdnjs.cloudflare.com","static.cloudflareinsights.com"]
        };

        const defaultIps = ["50.7.5.83","50.7.5.85","144.76.1.88","216.24.57.1","94.130.13.19","178.22.122.101","185.53.177.50"];

        // ==================== CORE FUNCTIONS ====================
        function setNetlifyMode(mode) {
            netlifyMode = mode;
            document.querySelectorAll('#netlify-options .sub-tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            document.getElementById('ip-group').style.display = mode === 'shecan' ? 'block' : 'none';
            updateLiveStats();
        }

        function setConfigMode(mode) {
            configMode = mode;
            document.querySelectorAll('#netlify-config-type .sub-tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            document.getElementById('custom-settings').style.display = mode === 'custom' ? 'block' : 'none';
        }

        function toggleAdvanced() {
            showAdvanced = !showAdvanced;
            document.getElementById('extra-params').style.display = showAdvanced ? 'flex' : 'none';
        }

        function loadDefaultDomains(type) {
            document.getElementById('domain-list').value = defaultLists[type].join('\n');
            updateLiveStats();
        }

        function loadDefaultIps() {
            document.getElementById('ip-list').value = defaultIps.join('\n');
            updateLiveStats();
        }

        function pasteToArea(id) {
            navigator.clipboard.readText().then(text => {
                const area = document.getElementById(id);
                area.value = area.value.trim() ? area.value + '\n' + text.trim() : text.trim();
                updateLiveStats();
            });
        }

        function generateRandomUUID() {
            const uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
            document.getElementById('custom-user').value = uuid;
        }

        function updateLiveStats() {
            const domainsText = document.getElementById('domain-list').value.trim();
            const domains = domainsText ? domainsText.split('\n').map(d => d.trim()).filter(Boolean) : [];
            let count = domains.length;

            if (netlifyMode === 'shecan') {
                const ipsText = document.getElementById('ip-list').value.trim();
                const ips = ipsText ? ipsText.split('\n').map(i => i.trim()).filter(Boolean) : [1];
                count *= ips.length;
            }

            document.getElementById('config-count').textContent = count || 0;
            document.getElementById('mode-indicator').textContent = `Mode: ${netlifyMode === 'shecan' ? 'IP + SNI' : 'Direct SNI'}`;
        }

        function generateConfigs() {
            const host = document.getElementById('main-host').value.trim() || "example.netlify.app";
            const domainsText = document.getElementById('domain-list').value.trim();
            
            if (!domainsText) {
                showToast("❌ Please enter at least one SNI domain!", true);
                return;
            }

            const domains = domainsText.split('\n').map(d => d.trim()).filter(Boolean);
            let uuid = "Telegram-Parsashonam";
            let path = "/p4r34m";

            if (configMode === 'custom') {
                uuid = document.getElementById('custom-user').value.trim() || uuid;
                path = document.getElementById('custom-path').value.trim() || path;
            }

            const fp = document.getElementById('fingerprint') ? document.getElementById('fingerprint').value : "chrome";
            const alpn = document.getElementById('alpn-select') ? document.getElementById('alpn-select').value : "h2,http/1.1";

            let configs = [];

            if (netlifyMode === 'shecan') {
                const ipsText = document.getElementById('ip-list').value.trim();
                const ips = ipsText ? ipsText.split('\n').map(i => i.trim()).filter(Boolean) : ["50.7.5.83"];

                domains.forEach(sni => {
                    ips.forEach(ip => {
                        let config = `vless://${uuid}@${ip}:443?encryption=none&security=tls&sni=${sni}&alpn=${alpn}&fp=${fp}&insecure=1&type=xhttp&host=${host}&path=${path}#IR_NETLIFY_${sni}`;
                        configs.push(config);
                    });
                });
            } else {
                domains.forEach(sni => {
                    let config = `vless://${uuid}@${sni}:443?encryption=none&security=tls&sni=${sni}&alpn=${alpn}&fp=${fp}&type=xhttp&host=${host}&path=${path}#IR_NETLIFY_${sni}`;
                    configs.push(config);
                });
            }

            const resultArea = document.getElementById('result-area');
            resultArea.value = configs.join('\n\n');
            document.getElementById('output-container').style.display = 'block';
            
            // Auto scroll to output
            resultArea.scrollIntoView({ behavior: "smooth" });
            
            showToast(`✅ Generated ${configs.length} ultra-fast configs!`, false);
        }

        function copyConfigs() {
            const text = document.getElementById('result-area').value;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                showToast("📋 All configs copied to clipboard!", false);
            });
        }

        function downloadConfigs() {
            const text = document.getElementById('result-area').value;
            if (!text) return;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `IR_NETLIFY_V10_${new Date().toISOString().slice(0,19).replace(/[:T]/g, '-')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("⬇️ Downloaded successfully!", false);
        }

        function shareConfigs() {
            const host = document.getElementById('main-host').value.trim();
            const domains = document.getElementById('domain-list').value.trim();
            const ips = document.getElementById('ip-list').value.trim();
            
            const data = {
                host: host || "example.netlify.app",
                domains: domains,
                ips: ips,
                mode: netlifyMode,
                configMode: configMode,
                uuid: configMode === 'custom' ? document.getElementById('custom-user').value : "",
                path: configMode === 'custom' ? document.getElementById('custom-path').value : ""
            };
            
            const encoded = btoa(JSON.stringify(data));
            const shareUrl = `${window.location.origin}${window.location.pathname}?import=${encoded}`;
            
            navigator.clipboard.writeText(shareUrl).then(() => {
                showToast("🔗 Shareable link copied! Send to friends", false);
            });
        }

        function showToast(msg, isError) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.color = isError ? '#ff6b00' : 'var(--neon-cyan)';
            toast.style.display = 'flex';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2800);
        }

        function confettiBurst() {
            showToast("⚡️ BACHELOR MODE MAXED OUT", false);
            // Simple confetti using canvas
            const canvas = document.createElement('canvas');
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.zIndex = '99999';
            canvas.style.pointerEvents = 'none';
            document.body.appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const colors = ['#00f0ff', '#c300ff', '#00ff9d', '#ff6b00'];
            const pieces = [];
            
            for (let i = 0; i < 280; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 8 + 4,
                    d: Math.random() * 3 + 1,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 20 - 10,
                    tiltAngle: 0
                });
            }
            
            let animationFrame;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let stillAlive = false;
                
                pieces.forEach(p => {
                    p.tiltAngle += 0.1;
                    p.y += (p.d + 3);
                    p.tilt = Math.sin(p.tiltAngle) * 15;
                    
                    ctx.beginPath();
                    ctx.lineWidth = p.r / 2;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt, p.y);
                    ctx.lineTo(p.x + p.tilt + p.r, p.y + p.r);
                    ctx.stroke();
                    
                    if (p.y < canvas.height) stillAlive = true;
                });
                
                if (stillAlive) {
                    animationFrame = requestAnimationFrame(animate);
                } else {
                    cancelAnimationFrame(animationFrame);
                    canvas.remove();
                }
            }
            animate();
            
            setTimeout(() => {
                if (canvas.parentNode) canvas.remove();
            }, 4500);
        }

        // ==================== INITIALIZATION ====================
        function loadFromShareLink() {
            const urlParams = new URLSearchParams(window.location.search);
            const importData = urlParams.get('import');
            if (!importData) return;
            
            try {
                const data = JSON.parse(atob(importData));
                document.getElementById('main-host').value = data.host || "";
                document.getElementById('domain-list').value = data.domains || "";
                if (data.ips) document.getElementById('ip-list').value = data.ips;
                
                if (data.mode) setNetlifyMode(data.mode);
                if (data.configMode) {
                    setConfigMode(data.configMode);
                    if (data.configMode === 'custom') {
                        if (data.uuid) document.getElementById('custom-user').value = data.uuid;
                        if (data.path) document.getElementById('custom-path').value = data.path;
                    }
                }
                showToast("✅ Imported shared configuration!", false);
                // Auto generate
                setTimeout(() => generateConfigs(), 800);
            } catch(e) {}
        }

        window.onload = () => {
            // Load defaults
            loadDefaultDomains('cncf');
            loadDefaultIps();
            
            // Set initial modes
            setNetlifyMode('shecan');
            setConfigMode('default');
            
            // Live stats on input
            const inputs = document.querySelectorAll('input, textarea');
            inputs.forEach(input => {
                input.addEventListener('input', updateLiveStats);
            });
            
            // Load any shared link
            loadFromShareLink();
            
            console.log('%c✅ IR NETLIFY V10 ULTIMATE BACHELOR EDITION loaded successfully', 'color:#00f0ff;font-weight:700;font-size:13px');
        };
    </script>
</body>
</html>
