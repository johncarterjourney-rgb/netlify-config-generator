
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IR NETLIFY V10.2 • BACHELOR EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
        
        :root {
            --bg: #0a0a0a;
            --surface: #161616;
            --border: #333333;
            --text: #f5f5f5;
            --accent: #00ff9d;
        }
        
        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px 12px;
        }
        
        .container {
            max-width: 640px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo {
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--accent);
        }
        
        .version {
            font-size: 0.68rem;
            background: #00ff9d;
            color: #000;
            padding: 1px 7px;
            border-radius: 999px;
            font-weight: 800;
            margin-left: 5px;
        }
        
        .tabs {
            display: flex;
            background: #111;
            border-radius: 9999px;
            padding: 4px;
            margin: 16px 0;
            border: 1px solid var(--border);
        }
        
        .tab-btn {
            flex: 1;
            padding: 11px 14px;
            border: none;
            background: transparent;
            color: #888;
            font-weight: 700;
            font-size: 0.85rem;
            border-radius: 9999px;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            background: #00ff9d;
            color: #000;
            font-weight: 800;
        }
        
        .section {
            margin-bottom: 18px;
        }
        
        .section-title {
            font-size: 0.78rem;
            color: #00ff9d;
            font-weight: 700;
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .input {
            width: 100%;
            padding: 11px 14px;
            background: #111;
            border: 1px solid var(--border);
            border-radius: 11px;
            color: var(--text);
            font-size: 0.92rem;
            margin-bottom: 9px;
        }
        
        .btn {
            padding: 10px 16px;
            border-radius: 11px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }
        
        .btn-primary {
            background: #00ff9d;
            color: #000;
        }
        
        .btn-secondary {
            background: transparent;
            border: 2px solid #555;
            color: #ccc;
        }
        
        .domain-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
            align-items: center;
        }
        
        .domain-row input {
            flex: 1;
            padding: 9px 12px;
            background: #111;
            border: 1px solid #444;
            border-radius: 9px;
            color: #fff;
            font-size: 0.88rem;
        }
        
        .toast {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: #fff;
            padding: 11px 24px;
            border-radius: 9999px;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            display: none;
            z-index: 9999;
            font-weight: 600;
        }
        
        .output {
            margin-top: 14px;
            display: none;
        }
        
        #result-area, #replacer-result, #tools-result {
            width: 100%;
            min-height: 200px;
            background: #111;
            border: 2px solid #00ff9d;
            border-radius: 12px;
            padding: 12px;
            color: #00ff9d;
            font-family: monospace;
            font-size: 0.82rem;
            line-height: 1.45;
            resize: vertical;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">IR NETLIFY <span class="version">V10.2</span></div>
            <div style="color:#888; font-size:0.72rem; margin-top:3px;">BACHELOR EDITION</div>
        </div>
        
        <div class="tabs">
            <button onclick="switchTab(0)" class="tab-btn active" id="tab0">⚡ Generator</button>
            <button onclick="switchTab(1)" class="tab-btn" id="tab1">🔄 Replacer</button>
            <button onclick="switchTab(2)" class="tab-btn" id="tab2">🔧 Tools</button>
        </div>
        
        <!-- TAB 0: GENERATOR -->
        <div id="panel-generator">
            <div class="section">
                <div class="section-title">Mode</div>
                <div style="display:flex; gap:6px; margin-bottom:12px;">
                    <button onclick="setNetlifyMode('shecan')" id="mode-shecan" class="btn btn-primary" style="flex:1; padding:9px 0; font-size:0.82rem;">IP + SNI</button>
                    <button onclick="setNetlifyMode('normal')" id="mode-normal" class="btn btn-secondary" style="flex:1; padding:9px 0; font-size:0.82rem;">Direct SNI</button>
                </div>
            </div>
            
            <div class="section">
                <div class="section-title">Server Type</div>
                <div style="display:flex; gap:6px; margin-bottom:12px;">
                    <button onclick="setConfigMode('default')" id="type-default" class="btn btn-secondary" style="flex:1; padding:8px 0; font-size:0.78rem;">Parsa / Xarheon</button>
                    <button onclick="setConfigMode('custom')" id="type-custom" class="btn btn-secondary" style="flex:1; padding:8px 0; font-size:0.78rem;">Custom</button>
                </div>
            </div>
            
            <!-- Multiple Netlify Domains -->
            <div class="section">
                <div class="section-title">Netlify Domains (Multiple)</div>
                <div id="gen-domain-container"></div>
                <div style="display:flex; gap:6px; margin-top:6px;">
                    <button onclick="addGenDomain()" class="btn btn-secondary" style="flex:1; padding:7px; font-size:0.75rem;">+ Add</button>
                    <button onclick="clearGenDomains()" class="btn btn-secondary" style="flex:1; padding:7px; font-size:0.75rem;">Clear All</button>
                </div>
            </div>
            
            <div class="section">
                <div class="section-title">SNI Domains</div>
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(68px, 1fr)); gap:5px; margin-bottom:8px;">
                    <button onclick="loadSniCategory('all', this)" class="btn btn-secondary" style="padding:6px; font-size:0.7rem;">ALL</button>
                    <button onclick="loadSniCategory('best', this)" class="btn btn-secondary" style="padding:6px; font-size:0.7rem;">BEST</button>
                    <button onclick="loadSniCategory('helm', this)" class="btn btn-secondary" style="padding:6px; font-size:0.7rem;">Helm</button>
                    <button onclick="loadSniCategory('k8s', this)" class="btn btn-secondary" style="padding:6px; font-size:0.7rem;">K8s</button>
                </div>
                <textarea id="domain-list" class="input" rows="3" placeholder="One SNI per line..."></textarea>
            </div>
            
            <div class="section" id="ip-section">
                <div class="section-title">IP Addresses (Shecan Mode)</div>
                <textarea id="ip-list" class="input" rows="2" placeholder="One IP per line..."></textarea>
            </div>
            
            <div style="display:flex; gap:8px; margin-top:8px;">
                <button onclick="generateConfigs()" class="btn btn-primary" style="flex:2; padding:14px; font-size:0.95rem;">⚡️ GENERATE</button>
            </div>
            
            <div id="output-container" class="output">
                <textarea id="result-area" readonly></textarea>
                <div style="display:flex; gap:6px; margin-top:8px;">
                    <button onclick="copyConfigs()" class="btn btn-primary" style="flex:1; padding:10px; font-size:0.82rem;">📋 COPY</button>
                    <button onclick="downloadConfigs()" class="btn btn-secondary" style="flex:1; padding:10px; font-size:0.82rem;">⬇️ TXT</button>
                    <button onclick="shareConfigs()" class="btn btn-secondary" style="flex:1; padding:10px; font-size:0.82rem;">🔗 SHARE</button>
                </div>
            </div>
        </div>
        
        <!-- TAB 1: REPLACER -->
        <div id="panel-replacer" style="display:none;">
            <div class="section">
                <div class="section-title">Target Netlify Domains</div>
                <div id="repl-domain-container"></div>
                <div style="display:flex; gap:6px; margin-top:6px;">
                    <button onclick="addReplDomain()" class="btn btn-secondary" style="flex:1; padding:7px; font-size:0.75rem;">+ Add Domain</button>
                    <button onclick="clearReplDomains()" class="btn btn-secondary" style="flex:1; padding:7px; font-size:0.75rem;">Clear All</button>
                </div>
            </div>
            
            <div class="section">
                <div class="section-title">Old Configs (Ping Tested)</div>
                <textarea id="old-configs" class="input" rows="5" placeholder="Paste your good configs here..."></textarea>
            </div>
            
            <div style="display:flex; gap:8px; margin-top:10px;">
                <button onclick="replaceAndDistribute()" class="btn btn-primary" style="flex:2; padding:13px; font-size:0.92rem;">🔄 REPLACE &amp; DISTRIBUTE</button>
            </div>
            
            <div id="replacer-output" class="output" style="display:none;">
                <textarea id="replacer-result" readonly></textarea>
                <div style="display:flex; gap:6px; margin-top:8px;">
                    <button onclick="copyReplacerResult()" class="btn btn-primary" style="flex:1; padding:10px; font-size:0.82rem;">📋 COPY</button>
                    <button onclick="downloadReplacerResult()" class="btn btn-secondary" style="flex:1; padding:10px; font-size:0.82rem;">⬇️ TXT</button>
                </div>
            </div>
        </div>
        
        <!-- TAB 2: TOOLS -->
        <div id="panel-tools" style="display:none;">
            <div class="section">
                <div class="section-title">Advanced Tools</div>
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap:6px; margin-bottom:12px;">
                    <button onclick="renameConfigs('ww')" class="btn btn-secondary" style="padding:9px; font-size:0.78rem;">ww</button>
                    <button onclick="renameConfigs('iran')" class="btn btn-secondary" style="padding:9px; font-size:0.78rem;">🇮🇷 IR</button>
                    <button onclick="renameConfigs('fast')" class="btn btn-secondary" style="padding:9px; font-size:0.78rem;">🚀 Fast</button>
                    <button onclick="renameConfigs('clean')" class="btn btn-secondary" style="padding:9px; font-size:0.78rem;">Clean</button>
                    <button onclick="dedupAndSort()" class="btn btn-secondary" style="padding:9px; font-size:0.78rem;">Dedup + Sort</button>
                    <button onclick="shuffleConfigs()" class="btn btn-secondary" style="padding:9px; font-size:0.78rem;">🔀 Shuffle</button>
                    <button onclick="extractNames()" class="btn btn-secondary" style="padding:9px; font-size:0.78rem;">Extract Names</button>
                </div>
            </div>
            
            <div class="section">
                <div class="section-title">Input Configs</div>
                <textarea id="tools-input" class="input" rows="4" placeholder="Paste configs here..."></textarea>
            </div>
            
            <div id="tools-output" class="output" style="display:none;">
                <textarea id="tools-result" readonly></textarea>
                <div style="display:flex; gap:6px; margin-top:8px;">
                    <button onclick="copyToolsResult()" class="btn btn-primary" style="flex:1; padding:10px; font-size:0.82rem;">📋 COPY</button>
                    <button onclick="downloadToolsResult()" class="btn btn-secondary" style="flex:1; padding:10px; font-size:0.82rem;">⬇️ TXT</button>
                </div>
            </div>
        </div>
        
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script>
        let netlifyMode = 'shecan';
        let configMode = 'default';
        let genDomainIds = [];
        let replDomainIds = [];
        
        const sniCategories = {
            all: ["helm.sh","blog.helm.sh","docs.helm.sh","kubernetes.io","kubectl.docs.kubernetes.io","kubebuilder.io","operatorframework.io","kind.sigs.k8s.io","kops.sigs.k8s.io","krew.sigs.k8s.io","kwok.sigs.k8s.io","kueue.sigs.k8s.io","jobset.sigs.k8s.io","kaniko.sigs.k8s.io","minikube.sigs.k8s.io","kustomize.sigs.k8s.io","cluster-api.sigs.k8s.io","descheduler.sigs.k8s.io","gateway-api.sigs.k8s.io","external-dns.sigs.k8s.io","service-apis.sigs.k8s.io","image-builder.sigs.k8s.io","metrics-server.sigs.k8s.io","scheduler-plugins.sigs.k8s.io","controller-runtime.sigs.k8s.io","prometheus-operator.sigs.k8s.io","node-feature-discovery.sigs.k8s.io","hierarchical-namespaces.sigs.k8s.io","secrets-store-csi-driver.sigs.k8s.io","security-profiles-operator.sigs.k8s.io","cluster-proportional-autoscaler.sigs.k8s.io","container.sigs.k8s.io","istio.io","cilium.io","linkerd.io","calico.org","rook.io","openebs.io","longhorn.io","fluxcd.io","argo-cd.readthedocs.io","tekton.dev","cert-manager.io","letsencrypt.org","keda.sh","crossplane.io","harbor.io"],
            best: ["kubernetes.io","letsencrypt.org","kwok.sigs.k8s.io","kind.sigs.k8s.io","kueue.sigs.k8s.io","jobset.sigs.k8s.io","minikube.sigs.k8s.io","kustomize.sigs.k8s.io","cluster-api.sigs.k8s.io","gateway-api.sigs.k8s.io","image-builder.sigs.k8s.io","secrets-store-csi-driver.sigs.k8s.io","helm.sh","fluxcd.io"],
            helm: ["helm.sh","blog.helm.sh","docs.helm.sh"],
            k8s: ["kubernetes.io","kubectl.docs.kubernetes.io","kubebuilder.io","operatorframework.io"]
        };
        
        const defaultIps = [
          "50.7.5.83","50.7.87.2","50.7.87.3","50.7.87.4","50.7.87.5",
          "75.2.60.5","144.76.1.88","104.21.33.34","188.114.98.0","188.114.99.0",
          "3.162.247.34","3.162.247.38","3.162.247.45","3.162.247.77","3.33.186.135",
          "63.176.8.218","85.10.207.48","94.130.33.41","95.216.69.37","104.198.14.52",
          "104.21.63.202","15.197.167.90","172.67.150.14","204.12.196.34","35.157.26.135",
          "52.222.214.38","52.222.214.99","54.232.119.62","65.109.34.234","94.130.70.160",
          "138.201.54.122","142.54.178.211","172.67.158.128","184.171.110.10",
          "52.222.214.108","52.222.214.124","63.141.252.203"
        ];
        
        function switchTab(tab) {
            document.getElementById('panel-generator').style.display = tab === 0 ? 'block' : 'none';
            document.getElementById('panel-replacer').style.display = tab === 1 ? 'block' : 'none';
            document.getElementById('panel-tools').style.display = tab === 2 ? 'block' : 'none';
            
            document.getElementById('tab0').classList.toggle('active', tab === 0);
            document.getElementById('tab1').classList.toggle('active', tab === 1);
            document.getElementById('tab2').classList.toggle('active', tab === 2);
        }
        
        function setNetlifyMode(mode) {
            netlifyMode = mode;
            document.getElementById('mode-shecan').classList.toggle('btn-primary', mode === 'shecan');
            document.getElementById('mode-shecan').classList.toggle('btn-secondary', mode !== 'shecan');
            document.getElementById('mode-normal').classList.toggle('btn-primary', mode === 'normal');
            document.getElementById('mode-normal').classList.toggle('btn-secondary', mode !== 'normal');
            document.getElementById('ip-section').style.display = mode === 'shecan' ? 'block' : 'none';
        }
        
        function setConfigMode(mode) {
            configMode = mode;
            document.getElementById('type-default').classList.toggle('btn-primary', mode === 'default');
            document.getElementById('type-default').classList.toggle('btn-secondary', mode !== 'default');
            document.getElementById('type-custom').classList.toggle('btn-primary', mode === 'custom');
            document.getElementById('type-custom').classList.toggle('btn-secondary', mode !== 'custom');
        }
        
        function loadSniCategory(category, btn) {
            document.getElementById('domain-list').value = sniCategories[category].join('\n');
            document.querySelectorAll('#panel-generator .btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }
        
        function loadDefaultIps() {
            document.getElementById('ip-list').value = defaultIps.join('\n');
        }
        
        // Generator multiple domains
        function addGenDomain(value = '') {
            const container = document.getElementById('gen-domain-container');
            const id = 'gen-dom-' + Date.now();
            const row = document.createElement('div');
            row.className = 'domain-row';
            row.innerHTML = `<input type="text" id="${id}" value="${value}" placeholder="your-project.netlify.app"><button onclick="removeGenDomain(this)" class="btn btn-secondary" style="padding:6px 10px; font-size:0.7rem;">✕</button>`;
            container.appendChild(row);
            genDomainIds.push(id);
        }
        
        function removeGenDomain(btn) {
            const row = btn.parentElement;
            const input = row.querySelector('input');
            if (input) {
                const idx = genDomainIds.indexOf(input.id);
                if (idx > -1) genDomainIds.splice(idx, 1);
            }
            row.remove();
        }
        
        function clearGenDomains() {
            document.getElementById('gen-domain-container').innerHTML = '';
            genDomainIds = [];
        }
        
        function getGenDomains() {
            const domains = [];
            genDomainIds.forEach(id => {
                const input = document.getElementById(id);
                if (input && input.value.trim()) domains.push(input.value.trim());
            });
            return domains.length > 0 ? domains : ['example.netlify.app'];
        }
        
        function generateConfigs() {
            const hosts = getGenDomains();
            const domains = document.getElementById('domain-list').value.trim().split('\n').filter(Boolean);
            const ips = document.getElementById('ip-list').value.trim().split('\n').filter(Boolean);
            
            if (!domains.length) { showToast("Please enter at least one SNI", true); return; }
            
            let uuid = "Telegram-Parsashonam";
            let path = "/p4r34m";
            
            if (configMode === 'custom') {
                uuid = prompt("UUID:", uuid) || uuid;
                path = prompt("Path:", path) || path;
            }
            
            let configs = [];
            let hostIndex = 0;
            
            if (netlifyMode === 'shecan' && ips.length > 0) {
                domains.forEach(sni => {
                    ips.forEach(ip => {
                        const host = hosts[hostIndex % hosts.length];
                        configs.push(`vless://${uuid}@${ip}:443?encryption=none&security=tls&sni=${sni}&alpn=h2,http/1.1&insecure=1&type=xhttp&host=${host}&path=${path}#IR_NETLIFY_${sni}`);
                        hostIndex++;
                    });
                });
            } else {
                domains.forEach(sni => {
                    const host = hosts[hostIndex % hosts.length];
                    configs.push(`vless://${uuid}@${sni}:443?encryption=none&security=tls&sni=${sni}&alpn=h2,http/1.1&type=xhttp&host=${host}&path=${path}#IR_NETLIFY_${sni}`);
                    hostIndex++;
                });
            }
            
            document.getElementById('result-area').value = configs.join('\n\n');
            document.getElementById('output-container').style.display = 'block';
            showToast(`✅ Generated ${configs.length} configs!`);
        }
        
        function copyConfigs() { navigator.clipboard.writeText(document.getElementById('result-area').value).then(() => showToast("📋 Copied!")); }
        function downloadConfigs() {
            const text = document.getElementById('result-area').value;
            const blob = new Blob([text], {type: "text/plain"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = `IR_NETLIFY_V10.2_${Date.now()}.txt`; a.click();
            URL.revokeObjectURL(url);
        }
        function shareConfigs() {
            const text = document.getElementById('result-area').value;
            if (!text) return;
            navigator.clipboard.writeText(`🔗 IR NETLIFY V10\n\n${text}`).then(() => showToast("🔗 Shared!"));
        }
        
        // Replacer
        function addReplDomain(value = '') {
            const container = document.getElementById('repl-domain-container');
            const id = 'repl-dom-' + Date.now();
            const row = document.createElement('div');
            row.className = 'domain-row';
            row.innerHTML = `<input type="text" id="${id}" value="${value}" placeholder="new-project.netlify.app"><button onclick="removeReplDomain(this)" class="btn btn-secondary" style="padding:6px 10px; font-size:0.7rem;">✕</button>`;
            container.appendChild(row);
            replDomainIds.push(id);
        }
        
        function removeReplDomain(btn) {
            const row = btn.parentElement;
            const input = row.querySelector('input');
            if (input) {
                const idx = replDomainIds.indexOf(input.id);
                if (idx > -1) replDomainIds.splice(idx, 1);
            }
            row.remove();
        }
        
        function clearReplDomains() {
            document.getElementById('repl-domain-container').innerHTML = '';
            replDomainIds = [];
        }
        
        function getReplDomains() {
            const domains = [];
            replDomainIds.forEach(id => {
                const input = document.getElementById(id);
                if (input && input.value.trim()) domains.push(input.value.trim());
            });
            return domains;
        }
        
        function replaceAndDistribute() {
            const domains = getReplDomains();
            const oldText = document.getElementById('old-configs').value.trim();
            
            if (domains.length === 0) { showToast("Add at least one domain", true); return; }
            if (!oldText) { showToast("Paste old configs", true); return; }
            
            const lines = oldText.split('\n\n').filter(Boolean);
            const newConfigs = [];
            
            lines.forEach((line, i) => {
                const target = domains[i % domains.length];
                newConfigs.push(line.replace(/host=([^&]+)/, `host=${target}`));
            });
            
            document.getElementById('replacer-result').value = newConfigs.join('\n\n');
            document.getElementById('replacer-output').style.display = 'block';
            showToast(`✅ ${newConfigs.length} configs updated!`);
        }
        
        function copyReplacerResult() { navigator.clipboard.writeText(document.getElementById('replacer-result').value).then(() => showToast("📋 Copied!")); }
        function downloadReplacerResult() {
            const text = document.getElementById('replacer-result').value;
            const blob = new Blob([text], {type: "text/plain"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = `REPLACED_${Date.now()}.txt`; a.click();
            URL.revokeObjectURL(url);
        }
        
        // Tools
        function renameConfigs(preset) {
            let text = document.getElementById('tools-input').value.trim();
            if (!text) { showToast("Paste configs first", true); return; }
            
            let prefix = "";
            if (preset === 'ww') prefix = "ww | ";
            else if (preset === 'iran') prefix = "🇮🇷 IR | ";
            else if (preset === 'fast') prefix = "🚀 FAST | ";
            
            const newText = text.split('\n\n').map(line => line.replace(/#(.+)$/, `#${prefix}$1`)).join('\n\n');
            document.getElementById('tools-result').value = newText;
            document.getElementById('tools-output').style.display = 'block';
            showToast(`✅ Renamed to ${preset}`);
        }
        
        function dedupAndSort() {
            let text = document.getElementById('tools-input').value.trim();
            if (!text) return;
            const lines = [...new Set(text.split('\n\n'))].sort();
            document.getElementById('tools-result').value = lines.join('\n\n');
            document.getElementById('tools-output').style.display = 'block';
            showToast(`✅ Deduped & Sorted (${lines.length})`);
        }
        
        function shuffleConfigs() {
            let text = document.getElementById('tools-input').value.trim();
            if (!text) return;
            let lines = text.split('\n\n');
            for (let i = lines.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [lines[i], lines[j]] = [lines[j], lines[i]];
            }
            document.getElementById('tools-result').value = lines.join('\n\n');
            document.getElementById('tools-output').style.display = 'block';
            showToast("✅ Shuffled!");
        }
        
        function extractNames() {
            let text = document.getElementById('tools-input').value.trim();
            if (!text) return;
            const names = (text.match(/#(.+)/g) || []).map(n => n.replace('#', '').trim());
            document.getElementById('tools-result').value = names.join('\n');
            document.getElementById('tools-output').style.display = 'block';
            showToast(`✅ ${names.length} names extracted`);
        }
        
        function copyToolsResult() { navigator.clipboard.writeText(document.getElementById('tools-result').value).then(() => showToast("📋 Copied!")); }
        function downloadToolsResult() {
            const text = document.getElementById('tools-result').value;
            const blob = new Blob([text], {type: "text/plain"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = `TOOLS_${Date.now()}.txt`; a.click();
            URL.revokeObjectURL(url);
        }
        
        function showToast(msg, error = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.color = error ? '#ff6b00' : '#ffffff';
            toast.style.display = 'flex';
            setTimeout(() => toast.style.display = 'none', 2400);
        }
        
        function init() {
            setNetlifyMode('shecan');
            setConfigMode('default');
            
            // Init generator domains (2 fields)
            const genContainer = document.getElementById('gen-domain-container');
            genContainer.innerHTML = '';
            genDomainIds = [];
            for (let i = 0; i < 2; i++) addGenDomain();
            
            // Init replacer domains (3 fields)
            const replContainer = document.getElementById('repl-domain-container');
            replContainer.innerHTML = '';
            replDomainIds = [];
            for (let i = 0; i < 3; i++) addReplDomain();
            
            // Default SNI
            document.getElementById('domain-list').value = sniCategories.best.join('\n');
            document.getElementById('ip-list').value = defaultIps.join('\n');
            
            // Show generator by default
            document.getElementById('panel-generator').style.display = 'block';
            document.getElementById('panel-replacer').style.display = 'none';
            document.getElementById('panel-tools').style.display = 'none';
        }
        
        window.onload = init;
    </script>
</body>
</html>
